[project]
name = "adonis"
version = "0.0.1"
description = "Contradiction Finder Across Your Docs"
readme = "PLAN.md"
requires-python = ">=3.11"
dependencies = [
   "fastapi>=0.110",
   "uvicorn[standard]>=0.29",
   "spacy>=3.7",
   "gliner>=0.2",
   "sentence-transformers>=2.7",
   "faiss-cpu>=1.8",
   "rapidfuzz>=3.6",
   "jinja2>=3.1",
   "pydantic>=2.6",
   "pydantic-settings>=2.2",
   "httpx>=0.27",
   "structlog>=24.1",
   "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adonis"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src/adonis"]
