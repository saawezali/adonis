name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
      # Docker (optional, not pushed unless you set DOCKERHUB_TOKEN)
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t adonis:${{ github.ref_name }} . || echo "docker build check done"
