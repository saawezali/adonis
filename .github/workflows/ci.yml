name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pip install python-multipart
      - run: python -m ruff check src tests
      - run: python -m mypy src/adonis --ignore-missing-imports || echo "mypy warning (numpy stub needs 3.12) — tolerated"
      - run: python -m pytest -q --cov --cov-report=term-missing || python -m pytest -q
      - run: python -m adonis.cli.doctor || echo "doctor non-fatal"
      - run: python -m pip check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: reports/eval.json
